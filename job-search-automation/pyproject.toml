[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davids-job-finder"
version = "0.1.0"
description = "Daily Swiss job discovery, verification, filtering, and ranking for David's profile"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
davids-job-finder = "jobfinder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobfinder*"]

[tool.unittest]
start-directory = "tests"

